[project]
name = "boardgame-rag"
version = "0.1.0"
description = "Grounded Q&A over board game rulebooks, with retrieval evaluation and an agentic retrieve-or-answer loop."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pypdf>=4.2",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
